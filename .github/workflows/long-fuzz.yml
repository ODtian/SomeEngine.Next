name: Long fuzz tests
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Decimal or hexadecimal seed
        default: '0x243F6A8885A308D3'
        required: true
      steps:
        description: Operation count (1 through 1000000)
        default: '10000'
        required: true
  schedule:
    - cron: '0 20 * * 6'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      SOMEENGINE_ECS_FUZZ_SEED: ${{ inputs.seed || '0x243F6A8885A308D3' }}
      SOMEENGINE_ECS_FUZZ_STEPS: ${{ inputs.steps || '10000' }}
      SOMEENGINE_ECS_FUZZ_EVIDENCE: ${{ github.workspace }}/artifacts/test-results/fuzz-evidence.json
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run seeded model comparison
        run: ./tools/Test.ps1 -Category LongFuzz -Project tests/SomeEngine.ECS.Fuzz.Tests/SomeEngine.ECS.Fuzz.Tests.csproj
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/test-results/**
            tests/**/bin/**/fuzz-failures/**
