name: Software adapter tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    name: Build all projects and test CPU / WARP
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build all projects and test content
        run: ./tools/Build.ps1
      - name: Run software adapter tests
        run: ./tools/Test.ps1 -NoBuild
      - name: Upload failure logs and images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: software-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/test-results/**
            tests/**/bin/**/fuzz-failures/**
            tests/**/bin/**/*.png
            tests/**/bin/**/*.bmp
            tests/**/bin/**/*.ppm
            tests/**/bin/**/*.log
